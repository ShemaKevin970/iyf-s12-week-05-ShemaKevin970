<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My To-Do List</title>

  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <main class="container">

    <h1>My To-Do List</h1>

    <form id="todo-form">

      <input

        id="todo-input"

        type="text"

        placeholder="Add a new task..."

        aria-label="New task"

      >

      <button type="submit">Add Task</button>

      <p id="form-error" role="alert"></p>

    </form>

    <p id="items-left">0 items left</p>

    <nav aria-label="Task filters">

      <button type="button" class="filter active"

        data-filter="all" aria-pressed="true">All</button>

      <button type="button" class="filter"

        data-filter="active" aria-pressed="false">Active</button>

      <button type="button" class="filter"

        data-filter="completed" aria-pressed="false">Completed</button>

    </nav>

    <ul id="todo-list"></ul>

    <button type="button" id="clear-completed">

      Clear Completed

    </button>

  </main>

  <script src="dom.js"></script>

</body>

</html>
